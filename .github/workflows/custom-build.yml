# 手动触发的自定义产品信息构建：
# 与正式 tag 构建（release-assets.yml）的差异：通过仓库 Variables 注入公司名与产品名，
# 仅产出 MSI 安装包（MSI 携带完整的公司名/发布者元数据，NSIS 模板不含 CompanyName）。
# 不创建 Release/Tag、不做任何签名；文件信息展示在 Job Summary，产物以 Artifact 供下载。
#
# 必需的仓库 Variables（Settings → Secrets and variables → Actions → Variables，
# 属敏感数据，不设默认值，缺失则构建直接报错终止）：
#   CUSTOM_APP_COMPANY_NAME  公司名：写入主程序 exe 的 CompanyName、MSI 的 Manufacturer（发布者）
#   CUSTOM_APP_PRODUCT_NAME  产品名：写入 exe 的 ProductName/FileDescription，并决定安装包文件名
#
# 版本号不在此覆盖，自动读取仓库 tauri.conf.json 的 version；
# 版权信息自动取当前年份，描述固定为「健康打卡桌面小工具」。
name: Custom Build For Windows

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    env:
      # 统一经 env 中转读取 Variables，shell 内只引用环境变量，避免表达式直接内插
      CUSTOM_APP_COMPANY_NAME: ${{ vars.CUSTOM_APP_COMPANY_NAME }}
      CUSTOM_APP_PRODUCT_NAME: ${{ vars.CUSTOM_APP_PRODUCT_NAME }}
    steps:
      # 两个变量均为必填，未配置直接失败，错误信息指明配置路径
      - name: Check required variables
        shell: bash
        run: |
          status=0
          if [ -z "${CUSTOM_APP_COMPANY_NAME}" ]; then
            echo "::error::仓库 Variables 未配置 CUSTOM_APP_COMPANY_NAME（仓库 Settings → Secrets and variables → Actions → Variables）"
            status=1
          fi
          if [ -z "${CUSTOM_APP_PRODUCT_NAME}" ]; then
            echo "::error::仓库 Variables 未配置 CUSTOM_APP_PRODUCT_NAME（仓库 Settings → Secrets and variables → Actions → Variables）"
            status=1
          fi
          exit $status

      # 拉取代码，fetch-depth: 0 获取完整历史（与 release-assets.yml 保持一致）
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装 pnpm 包管理器（项目使用 pnpm 管理依赖）
      # 必须在 setup-node 之前：setup-node 的 cache: pnpm 需要调用 pnpm 读取 lockfile 来设置缓存 key
      - uses: pnpm/action-setup@v6

      # 安装 Node.js（前端构建需要）
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # 安装 Rust 工具链（Tauri 后端使用 Rust 编写）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # 安装前端及 Tauri 依赖
      - name: Install app dependencies
        run: pnpm install

      # 运行时生成配置覆盖文件（不提交仓库，正常 tag 构建零影响）：
      # - productName / publisher 来自仓库 Variables（经 env 中转，node 从 process.env 读取并生成 JSON，天然处理转义）
      # - createUpdaterArtifacts: false —— 内部构建不发布，免去 updater 签名私钥要求
      # - plugins.updater.active: false —— 禁用官方自动更新，防止自定义品牌构建静默升级回官方正式品牌
      # - targets 仅 msi —— 不覆盖 version，自动读取仓库 tauri.conf.json 的版本号
      - name: Generate config overlay
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const conf = {
            productName: process.env.CUSTOM_APP_PRODUCT_NAME,
            bundle: {
              targets: ["msi"],
              publisher: process.env.CUSTOM_APP_COMPANY_NAME,
              copyright: `版权所有©${new Date().getFullYear()}`,
              shortDescription: "健康打卡桌面小工具",
              createUpdaterArtifacts: false,
            },
            plugins: {
              updater: {
                active: false,
              },
            },
          };
          fs.writeFileSync("src-tauri/tauri.custom.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '
          cat src-tauri/tauri.custom.conf.json

      # 构建命令与 tauri-action 的调用方式完全同构（tauriScript: pnpm tauri:build + build 子命令），
      # --config 深度合并覆盖 tauri.conf.json
      - name: Build Windows MSI
        run: pnpm tauri:build build --config src-tauri/tauri.custom.conf.json

      # 展示文件信息：日志 + Job Summary（文件名 / 大小 / SHA256）
      - name: Show build info
        shell: bash
        run: |
          echo "### 📦 Custom Build 产物信息" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 文件名 | 大小 | SHA256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            echo "=== $name ==="
            echo "size: $size"
            echo "sha256: $sha"
            echo "| \`$name\` | $size | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      # 上传产物到 Artifact，在本 workflow 运行页面底部 Artifacts 区下载
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: custom-build-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
